name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create Android project from the game file
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/java/com/anis/game2 app/src/main/res/values app/src/main/res/drawable
          cp "$(ls *.html | head -1)" app/src/main/assets/index.html
          cat > settings.gradle <<'EOF0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'anis2'
          include ':app'
          EOF0
          cat > build.gradle <<'EOF1'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF1
          cat > gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx3g
          EOF2
          cat > app/build.gradle <<'EOF3'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.anis.game2'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.anis.game2'
                  minSdk 21
                  targetSdk 34
                  versionCode 16
                  versionName '1.6'
              }
              buildTypes { release { minifyEnabled false } }
          }
          EOF3
          cat > app/src/main/AndroidManifest.xml <<'EOF4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF4
          cat > app/src/main/res/values/strings.xml <<'EOF5'
          <resources><string name="app_name">anis 2</string></resources>
          EOF5
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF6'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFD23F" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#111111" android:pathData="M20,80h68v10h-68z"/>
              <path android:fillColor="#111111" android:pathData="M58,80l7,-16l7,16z M72,80l7,-16l7,16z"/>
              <path android:fillColor="#111111" android:pathData="M30,40a7,7 0 1,1 14,0a7,7 0 1,1 -14,0z M29,49h16v20h-16z"/>
          </vector>
          EOF6
          cat > app/src/main/java/com/anis/game2/MainActivity.java <<'EOF7'
          package com.anis.game2;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView w;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  w = new WebView(this);
                  w.setBackgroundColor(Color.BLACK);
                  w.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  w.setWebViewClient(new WebViewClient());
                  w.setWebChromeClient(new WebChromeClient());
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }

              private void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) immersive(); }
              @Override protected void onPause() { super.onPause(); w.onPause(); w.pauseTimers(); }
              @Override protected void onResume() { super.onResume(); w.onResume(); w.resumeTimers(); }
              @Override public void onBackPressed() { moveTaskToBack(true); }
              @Override protected void onDestroy() { w.destroy(); super.onDestroy(); }
          }
          EOF7
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: anis2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
